name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # We do not need a service container here because we are using Testcontainers in our tests!
    # Testcontainers will automatically spin up PostgreSQL and PGVector during the test phase.

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests (including Integration Tests via Testcontainers)
      run: cd backend && mvn -B clean test
      env:
        OPENAI_API_KEY: "dummy-key-for-ci"

    - name: Build Application JAR
      run: cd backend && mvn -B package -DskipTests

    - name: Build Docker Image
      run: cd backend && docker build -t opspilot:latest .


