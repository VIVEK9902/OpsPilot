version: '3.8'

services:
  app:
    build: .
    container_name: opspilot_app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-opspilot}
      - POSTGRES_USER=${POSTGRES_USER:-opspilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-opspilot_dev}
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - opspilot_network
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: opspilot_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-opspilot}
      - POSTGRES_USER=${POSTGRES_USER:-opspilot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-opspilot_dev}
    ports:
      - "5432:5432"
    volumes:
      - opspilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opspilot} -d ${POSTGRES_DB:-opspilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opspilot_network
    restart: unless-stopped

volumes:
  opspilot_pgdata:

networks:
  opspilot_network:

